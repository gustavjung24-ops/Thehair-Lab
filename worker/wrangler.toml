name = "thehairlab-leads-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cloudflare D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "thehairlab-leads"
# database_id will be filled after: wrangler d1 create thehairlab-leads
database_id = "246086b1-150c-4b25-a13c-1d08d93c1409"

[vars]
TELEGRAM_LEADS_CHAT_ID = "REPLACE_WITH_TELEGRAM_GROUP_ID"
GOOGLE_LEADS_SHEET_TAB = "leads"

# Secrets (set via: wrangler secret put SECRET_NAME)
# TELEGRAM_BOT_TOKEN
# GOOGLE_SERVICE_ACCOUNT_EMAIL
# GOOGLE_PRIVATE_KEY
# GOOGLE_PROJECT_ID
# GOOGLE_LEADS_SHEET_ID
